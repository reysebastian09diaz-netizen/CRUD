<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;700&family=Roboto+Slab:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="build/css/app.css">
  <title>Proyecto de barcos</title>
</head>

<body>
  <!-- Mantienes tu header original -->
  <header class="header">
    <div class="contenedor contenido-header">
      <h1>Proyecto de barcos</h1>
      <nav class="navegacion-principal">
        <a href="#">Usuarios</a>
        <a href="#">Clientes</a>
        <a href="#">Barcos</a>
        <a href="#">Salidas</a>
        <a href="#">Login</a>
      </nav>
    </div>
  </header>

  <!-- AGREGAS ESTE BLOQUE MAIN DEBAJO DEL HEADER -->
  <main class="login-container">
    <form class="login-card" action="#" method="POST">
      <h2>Login</h2>

      <div class="campo">
        <label for="documento">Documento de usuario</label>
        <input type="text" id="documento" name="documento" placeholder="Documento de usuario">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Contraseña">
      </div>

      <button type="submit" class="btn-submit">Enviar</button>
    </form>
  </main>

</body>

</html>
